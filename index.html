<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earmark</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Earmark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single phone-width column, list -> recorder -> note, with a docked record button like a hardware deck */
:root {
  --bg: #ECEEF2;
  --surface: #FFFFFF;
  --ink: #141821;
  --muted: #5B6271;
  --line: #D6DAE2;
  --rec: #E2362A;
  --rec-ink: #FFFFFF;
  --mark: #FFE7A0;
  --mark-ink: #4A3A06;
  --chip: #E1E5EC;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0E1014; --surface: #181B22; --ink: #ECEEF2; --muted: #98A0AE; --line: #2A2F3A;
  --rec: #FF5244; --rec-ink: #FFFFFF; --mark: #463A12; --mark-ink: #FFE7A0; --chip: #232733; color-scheme: dark } }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 140px; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 2.1rem; line-height: 1.1; font-weight: 700; }
h2 { font-size: 1.45rem; line-height: 1.2; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.panel { display: flex; flex-direction: column; gap: 14px; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.iconbtn { background: none; border: 0; padding: 8px; margin: -8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); }
.iconbtn svg { width: 22px; height: 22px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font: inherit; color: var(--ink); }

.notes { display: flex; flex-direction: column; background: var(--surface); border-radius: 16px; overflow: hidden; }
.note-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.note-row:last-child { border-bottom: 0; }
.note-row .t { font-weight: 600; min-width: 0; display: flex; align-items: center; gap: 6px; }
.note-row .t span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-row .d { color: var(--muted); font-size: 0.82rem; }
.note-row .p { grid-column: 1 / -1; color: var(--muted); font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pill { flex: none; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: var(--mark); color: var(--mark-ink); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }

.dock { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-top: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: center; align-items: center; gap: 28px; background: linear-gradient(to top, var(--bg) 60%, transparent); }
.recbtn { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--surface); background: var(--rec); box-shadow: 0 0 0 2px var(--rec), 0 8px 24px color-mix(in srgb, var(--rec) 35%, transparent); display: grid; place-items: center; }
.recbtn span { width: 26px; height: 26px; border-radius: 50%; background: var(--rec-ink); transition: border-radius .2s, transform .2s; }
.recbtn.live span { border-radius: 5px; transform: scale(.85); }
.sidebtn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; font-size: 0.9rem; font-weight: 500; white-space: nowrap; }
.dock .spacer { width: 120px; }
@media (max-width: 420px) { .dock { gap: 14px; } .sidebtn { padding: 10px 12px; font-size: 0.85rem; } .dock .spacer { width: 104px; } }

.clock { font-family: var(--mono); font-size: 3.2rem; font-weight: 500; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--rec); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
canvas.wave { width: 100%; height: 88px; display: block; background: var(--surface); border-radius: 14px; }
.live-tx { background: var(--surface); border-radius: 14px; padding: 14px 16px; min-height: 160px; max-height: 45vh; overflow-y: auto; }
.seg { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 3px 0; }
.ts { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); padding-top: 3px; background: none; border: 0; text-align: left; padding-left: 0; }
button.ts:hover { color: var(--rec); }
.interim { color: var(--muted); font-style: italic; }
.notice { background: var(--mark); color: var(--mark-ink); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; }

.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 0.85rem; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 0.88rem; }
.btn.danger { color: var(--rec); }
.send { width: 100%; border: 0; border-radius: 14px; padding: 15px 18px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 1.02rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .45; cursor: default; }
textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; resize: vertical; }
audio { width: 100%; }
details summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 0.88rem; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.toast a { color: inherit; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <!-- LIST VIEW -->
  <section id="view-list" class="panel">
    <div class="topbar">
      <div>
        <div class="label">Voice notes</div>
        <h1>Earmark</h1>
      </div>
      <span class="small muted" id="count"></span>
    </div>
    <input id="q" class="search" type="search" placeholder="Search transcripts" aria-label="Search notes">
    <div id="notes" class="notes"></div>
  </section>

  <!-- RECORD VIEW -->
  <section id="view-rec" class="panel" hidden>
    <div class="topbar">
      <button class="iconbtn" id="rec-cancel" aria-label="Discard recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="status"><span class="dot" id="rec-dot"></span><span id="rec-status">Ready</span></span>
      <span style="width:22px"></span>
    </div>
    <div class="clock" id="clock">00:00</div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div id="rec-notice" class="notice" hidden></div>
    <div class="label">Live transcript</div>
    <div class="live-tx" id="live-tx"><span class="muted">Words appear here as you talk.</span></div>
  </section>

  <!-- NOTE VIEW -->
  <section id="view-note" class="panel" hidden>
    <div class="topbar">
      <button class="iconbtn" id="n-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>Notes</button>
      <button class="btn danger" id="n-del">Delete</button>
    </div>
    <div>
      <h2 id="n-title"></h2>
      <div class="meta" id="n-meta"></div>
    </div>
    <button class="send" id="n-send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
      Send transcript to Claude
    </button>
    <audio id="n-audio" controls hidden></audio>
    <div class="card" id="n-tx"></div>
    <details class="card">
      <summary>Edit transcript</summary>
      <textarea id="tx-edit" placeholder="Type or paste what was said, one line per sentence…"></textarea>
      <div class="row"><button class="btn" id="tx-save">Save transcript</button></div>
    </details>
  </section>
</div>

<div class="dock" id="dock">
  <span class="spacer" aria-hidden="true"></span>
  <button class="recbtn" id="btn-rec" aria-label="Start recording"><span></span></button>
  <button class="sidebtn" id="btn-upload">Import audio</button>
  <input type="file" id="file" accept="audio/*" hidden>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let toastT;
function toast(html, ms) { const t = $("#toast"); t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms || 2400); }

/* ---------- storage ---------- */
const KEY = "earmark.notes.v1", SEEDED = "earmark.seeded.v1";
let notes = [];
function load() { try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { notes = []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch {} }
let idb = null;
function openIdb() {
  if (idb) return idb;
  idb = new Promise((res) => {
    try { const r = indexedDB.open("earmark-audio", 1); r.onupgradeneeded = () => r.result.createObjectStore("a"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }
    catch { res(null); }
  });
  return idb;
}
async function putAudio(id, blob) { const db = await openIdb(); if (!db) return; try { db.transaction("a", "readwrite").objectStore("a").put(blob, id); } catch {} }
async function getAudio(id) { const db = await openIdb(); if (!db) return null; return new Promise((res) => { try { const r = db.transaction("a").objectStore("a").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch { res(null); } }); }
async function delAudio(id) { const db = await openIdb(); if (!db) return; try { db.transaction("a", "readwrite").objectStore("a").delete(id); } catch {} }

const EXAMPLE = { id: "ex1", example: true, title: "Spring catalog launch sync", created: Date.now() - 3600e3 * 26, duration: 146,
  transcript: [
    { t: 0, text: "Okay, let's get started. This is the Thursday sync for the spring catalog launch." },
    { t: 9, text: "Priya, where are we on product photography?" },
    { t: 14, text: "We shot forty of the sixty items. The remaining twenty need the studio again, and the earliest slot is March 11th." },
    { t: 31, text: "That's tight. The site freeze is March 18th, so retouching has a week." },
    { t: 44, text: "Marco can take retouching if we send files the same day. I'll book the studio today." },
    { t: 62, text: "Next, pricing. Finance wants the new ceramics line at 10 percent above last year, but we should hold the large planters flat." },
    { t: 101, text: "Dana, can you draft that note to finance by Monday? Yes, I'll send it Monday morning." },
    { t: 118, text: "Last thing, we're moving the launch email from Tuesday to Wednesday because of the holiday." }
  ] };
function seed() {
  let seeded = false; try { seeded = localStorage.getItem(SEEDED) === "1"; } catch {}
  if (!seeded && notes.length === 0) { notes = [EXAMPLE]; save(); try { localStorage.setItem(SEEDED, "1"); } catch {} }
}
function titleOf(n) { return n.title || n.ai?.title || autoTitle(n); }
function autoTitle(n) {
  const first = (n.transcript[0]?.text || "").replace(/[^\w\s']/g, "").split(/\s+/).filter(Boolean).slice(0, 6).join(" ");
  return first || "Recording " + new Date(n.created).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

/* ---------- routing ---------- */
let current = null;
function show(view) {
  for (const v of ["list", "rec", "note"]) $("#view-" + v).hidden = v !== view;
  $("#dock").hidden = view === "note";
  $("#btn-upload").hidden = view === "rec";
  window.scrollTo(0, 0);
}
$("#n-back").addEventListener("click", () => { renderList(); show("list"); });

/* ---------- list ---------- */
const plain = (n) => n.transcript.map((s) => s.text).join(" ");
function when(ts) {
  const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return "Today " + time;
  if (d.toDateString() === y.toDateString()) return "Yesterday " + time;
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}
function renderList() {
  const q = $("#q").value.trim().toLowerCase();
  const list = notes.slice().sort((a, b) => b.created - a.created).filter((n) => !q || (titleOf(n) + " " + plain(n)).toLowerCase().includes(q));
  $("#count").textContent = notes.length ? notes.length + (notes.length === 1 ? " note" : " notes") : "";
  const box = $("#notes");
  if (!list.length) {
    box.innerHTML = '<div class="empty">' + (q ? "No notes match “" + esc(q) + "”." : "No notes yet. Tap the red button to record your first one.") + "</div>";
    return;
  }
  box.innerHTML = list.map((n) =>
    '<button class="note-row" data-id="' + esc(n.id) + '"><span class="t"><span>' + esc(titleOf(n)) + "</span>" +
    (n.example ? '<span class="pill">Example</span>' : "") + '</span><span class="d mono">' + fmt(n.duration) +
    '</span><span class="p">' + esc(plain(n) || "No transcript yet") + '</span><span class="d">' + esc(when(n.created)) + "</span></button>").join("");
  box.querySelectorAll(".note-row").forEach((b) => b.addEventListener("click", () => openNote(b.dataset.id)));
}
$("#q").addEventListener("input", renderList);

/* ---------- recorder ---------- */
const R = { stream: null, mr: null, chunks: [], ctx: null, an: null, raf: 0, start: 0, elapsed: 0, timer: 0, sr: null, segs: [], interim: "", live: false, levels: [] };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

$("#btn-rec").addEventListener("click", () => {
  if ($("#view-rec").hidden) startRecording();
  else if (R.live) stopRecording(true);
});
$("#rec-cancel").addEventListener("click", () => { stopRecording(false); $("#dock").hidden = false; renderList(); show("list"); });

function setStatus(txt, on) { $("#rec-status").textContent = txt; $("#rec-dot").classList.toggle("on", !!on); $("#btn-rec").classList.toggle("live", !!on); $("#btn-rec").setAttribute("aria-label", on ? "Stop and save" : "Start recording"); }

async function startRecording() {
  Object.assign(R, { chunks: [], segs: [], interim: "", elapsed: 0, levels: [] });
  $("#clock").textContent = "00:00";
  $("#live-tx").innerHTML = '<span class="muted">Words appear here as you talk.</span>';
  $("#rec-notice").hidden = true;
  show("rec");
  setStatus("Starting…", false);
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("nomedia");
    R.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    setStatus("No microphone", false);
    $("#dock").hidden = true;
    const n = $("#rec-notice"); n.hidden = false;
    n.textContent = "Earmark can’t reach the microphone. On iPhone, go to Settings → Safari → Microphone and choose Ask or Allow, then try again.";
    return;
  }
  const mime = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/aac"].find((m) => window.MediaRecorder?.isTypeSupported?.(m)) || "";
  try { R.mr = new MediaRecorder(R.stream, mime ? { mimeType: mime } : undefined); } catch { R.mr = null; }
  if (R.mr) { R.mr.ondataavailable = (e) => e.data.size && R.chunks.push(e.data); R.mr.start(1000); }
  try {
    R.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = R.ctx.createMediaStreamSource(R.stream);
    R.an = R.ctx.createAnalyser(); R.an.fftSize = 1024; src.connect(R.an);
  } catch { R.an = null; }
  R.live = true; R.start = performance.now();
  setStatus("Recording", true);
  R.timer = setInterval(() => { $("#clock").textContent = fmt(curTime()); }, 250);
  drawWave();
  startSpeech();
}
function curTime() { return R.elapsed + (R.live ? (performance.now() - R.start) / 1000 : 0); }

function startSpeech() {
  if (!SR) { const n = $("#rec-notice"); n.hidden = false; n.textContent = "This browser records audio but can’t transcribe live. The audio is still saved, and you can type the transcript in the note."; return; }
  const sr = new SR(); R.sr = sr;
  sr.continuous = true; sr.interimResults = true; sr.lang = navigator.language || "en-US";
  let segStart = curTime();
  sr.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) { const text = r[0].transcript.trim(); if (text) R.segs.push({ t: Math.floor(segStart), text: text.charAt(0).toUpperCase() + text.slice(1) }); segStart = curTime(); }
      else interim += r[0].transcript;
    }
    R.interim = interim; renderLive();
  };
  sr.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { R.sr = null; const n = $("#rec-notice"); n.hidden = false; n.textContent = "Live transcription was blocked. The audio is still recording."; } };
  sr.onend = () => { if (R.live && R.sr === sr) { try { sr.start(); } catch {} } };
  try { sr.start(); } catch {}
}
function renderLive() {
  const box = $("#live-tx");
  const segs = R.segs.map((s) => '<div class="seg"><span class="ts">' + fmt(s.t) + "</span><span>" + esc(s.text) + "</span></div>").join("");
  const interim = R.interim ? '<div class="seg"><span class="ts">' + fmt(curTime()) + '</span><span class="interim">' + esc(R.interim) + "</span></div>" : "";
  box.innerHTML = (segs + interim) || '<span class="muted">Listening…</span>';
  box.scrollTop = box.scrollHeight;
}
function drawWave() {
  const c = $("#wave"), g = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const buf = R.an ? new Uint8Array(R.an.fftSize) : null;
  const css = getComputedStyle(document.documentElement);
  const step = () => {
    if (!R.live) return;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
    let lvl = 0;
    if (buf) { R.an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) { const x = (v - 128) / 128; sum += x * x; } lvl = Math.min(1, Math.sqrt(sum / buf.length) * 4); }
    R.levels.push(lvl); const bars = Math.floor(w / 5); if (R.levels.length > bars) R.levels.splice(0, R.levels.length - bars);
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const rec = css.getPropertyValue("--rec").trim(), ink = css.getPropertyValue("--ink").trim(), dim = css.getPropertyValue("--line").trim();
    g.fillStyle = dim; g.fillRect(0, h / 2 - 0.5, w, 1);
    R.levels.forEach((l, i) => { const bh = Math.max(2, l * (h - 12)); g.fillStyle = i > R.levels.length - 4 ? rec : ink; g.globalAlpha = 0.35 + 0.65 * (i / R.levels.length); g.fillRect(w - (R.levels.length - i) * 5, (h - bh) / 2, 3, bh); });
    g.globalAlpha = 1;
    R.raf = requestAnimationFrame(step);
  };
  step();
}
function stopRecording(keep) {
  const duration = curTime();
  R.live = false; clearInterval(R.timer); cancelAnimationFrame(R.raf);
  const sr = R.sr; R.sr = null; try { sr && sr.stop(); } catch {}
  if (R.interim.trim()) { R.segs.push({ t: Math.max(0, Math.floor(duration - 3)), text: R.interim.trim() }); R.interim = ""; }
  const finish = () => {
    R.stream?.getTracks().forEach((t) => t.stop()); R.stream = null;
    try { R.ctx && R.ctx.close(); } catch {}
    setStatus("Ready", false);
    if (!keep) return;
    const n = { id: uid(), created: Date.now(), duration, transcript: R.segs.slice(), hasAudio: false };
    if (R.chunks.length) { n.hasAudio = true; putAudio(n.id, new Blob(R.chunks, { type: R.mr?.mimeType || "audio/mp4" })); }
    notes.push(n); save(); openNote(n.id);
  };
  if (R.mr && R.mr.state !== "inactive") { R.mr.onstop = finish; try { R.mr.stop(); } catch { finish(); } }
  else finish();
}

/* ---------- import ---------- */
$("#btn-upload").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const dur = await new Promise((res) => { const a = new Audio(); a.preload = "metadata"; a.onloadedmetadata = () => res(isFinite(a.duration) ? a.duration : 0); a.onerror = () => res(0); a.src = URL.createObjectURL(f); });
  const n = { id: uid(), created: Date.now(), duration: dur, title: f.name.replace(/\.[^.]+$/, "").slice(0, 60), transcript: [], hasAudio: true };
  await putAudio(n.id, f);
  notes.push(n); save(); openNote(n.id);
});

/* ---------- note ---------- */
let audioUrl = null;
async function openNote(id) {
  current = id;
  show("note"); renderNote();
  const n = notes.find((x) => x.id === id); const a = $("#n-audio");
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  a.hidden = true; a.removeAttribute("src");
  if (n?.hasAudio) { const blob = await getAudio(id); if (blob && current === id) { audioUrl = URL.createObjectURL(blob); a.src = audioUrl; a.hidden = false; } }
}
function renderNote() {
  const n = notes.find((x) => x.id === current); if (!n) return;
  $("#n-title").textContent = titleOf(n);
  const words = n.transcript.reduce((a, s) => a + s.text.split(/\s+/).length, 0);
  $("#n-meta").innerHTML = "<span>" + esc(new Date(n.created).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })) + '</span><span class="mono">' + fmt(n.duration) + "</span><span>" + words.toLocaleString() + " words</span>" + (n.example ? '<span class="pill">Example</span>' : "");
  $("#n-send").disabled = !n.transcript.length;
  const T = $("#n-tx");
  T.innerHTML = n.transcript.length
    ? '<div class="label">Transcript</div>' + n.transcript.map((s) => '<div class="seg"><button class="ts" data-t="' + s.t + '" aria-label="Play from ' + fmt(s.t) + '">' + fmt(s.t) + "</button><span>" + esc(s.text) + "</span></div>").join("")
    : '<p class="muted" style="margin:0">No words were captured. Open “Edit transcript” below to type what was said.</p>';
  T.querySelectorAll(".ts").forEach((b) => b.addEventListener("click", () => { const a = $("#n-audio"); if (!a.hidden) { a.currentTime = Number(b.dataset.t); a.play().catch(() => {}); } }));
  $("#tx-edit").value = n.transcript.map((s) => s.text).join("\n");
}
$("#tx-save").addEventListener("click", () => {
  const n = notes.find((x) => x.id === current); if (!n) return;
  const lines = $("#tx-edit").value.split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const old = n.transcript; const span = n.duration || lines.length * 8;
  n.transcript = lines.map((text, i) => ({ t: old[i]?.t ?? Math.round((i / Math.max(1, lines.length)) * span), text }));
  delete n.example; save(); renderNote(); toast("Transcript saved");
});

/* ---------- send to Claude ---------- */
function transcriptText(n) {
  const head = "Transcript of my voice note “" + titleOf(n) + "” (" + new Date(n.created).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + ", " + fmt(n.duration) + "):";
  return head + "\n\n" + n.transcript.map((s) => "[" + fmt(s.t) + "] " + s.text).join("\n");
}
$("#n-send").addEventListener("click", async () => {
  const n = notes.find((x) => x.id === current); if (!n || !n.transcript.length) return;
  const text = transcriptText(n);
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('Transcript copied. <a href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a> and paste it.', 6000);
  } catch {
    $("#tx-edit").closest("details").open = true; $("#tx-edit").select();
    toast("Couldn’t copy automatically. The transcript is selected below; copy it and paste it into Claude.", 6000);
  }
});

let delArmed = 0;
$("#n-del").addEventListener("click", () => {
  const b = $("#n-del");
  if (Date.now() - delArmed > 3000) { delArmed = Date.now(); b.textContent = "Tap again to delete"; setTimeout(() => (b.textContent = "Delete"), 3000); return; }
  notes = notes.filter((x) => x.id !== current); delAudio(current); save(); b.textContent = "Delete"; delArmed = 0;
  current = null; renderList(); show("list"); toast("Note deleted");
});

/* ---------- boot ---------- */
load(); seed(); renderList(); show("list");
})();
</script>
