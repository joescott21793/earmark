<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earmark</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Earmark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
/* Layout: native iPhone feel. Large titles that collapse into a frosted nav bar, inset grouped lists, a frosted bottom toolbar */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fill: rgba(118, 118, 128, 0.12);
  --label: #000000;
  --label2: rgba(60, 60, 67, 0.6);
  --label3: rgba(60, 60, 67, 0.3);
  --sep: rgba(60, 60, 67, 0.2);
  --tint: #FF3B30;
  --tint-soft: rgba(255, 59, 48, 0.12);
  --orange: #FF9500;
  --seg: #FFFFFF;
  --bar: rgba(249, 249, 249, 0.82);
  --ink-btn: #FFFFFF;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118, 118, 128, 0.24);
  --label: #FFFFFF; --label2: rgba(235, 235, 245, 0.6); --label3: rgba(235, 235, 245, 0.3); --sep: rgba(84, 84, 88, 0.6);
  --tint: #FF453A; --tint-soft: rgba(255, 69, 58, 0.2); --orange: #FF9F0A; --seg: #636366; --bar: rgba(22, 22, 24, 0.82);
  color-scheme: dark } }

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--label); font: 17px/1.35 var(--font); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; }
svg { display: block; }
.num { font-variant-numeric: tabular-nums; }
.view { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }

/* nav bar */
.nav { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: calc(44px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); border-bottom: 0.5px solid transparent; transition: background .2s, border-color .2s; }
body.scrolled .nav { background: var(--bar); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border-bottom-color: var(--sep); }
.nav-title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s; max-width: 58vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
body.scrolled .nav-title, .nav-title.always { opacity: 1; }
.nav-btn { justify-self: start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--tint); font-size: 17px; padding: 10px 8px; }
.nav-btn.end { justify-self: end; }
.nav-btn svg { width: 22px; height: 22px; }
.large-title { font-family: var(--display); font-size: 34px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; margin: 2px 0 0; }
.date-line { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: -18px; padding-top: 4px; }

/* search */
.searchfield { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; padding: 0 8px; height: 36px; color: var(--label2); }
.searchfield svg { width: 17px; height: 17px; flex: none; }
.searchfield input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; color: var(--label); outline: none; }
.searchfield input::placeholder { color: var(--label2); }

/* grouped lists */
.section { display: flex; flex-direction: column; gap: 7px; }
.section-head { font-size: 20px; font-weight: 700; padding: 0 4px; }
.section-cap { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: 0.02em; padding: 0 16px; }
.section-foot { font-size: 13px; color: var(--label2); padding: 0 16px; line-height: 1.4; }
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.cell { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 11px 16px; border: 0; background: var(--card); text-align: left; }
.cell + .cell::before, .row + .row .row-main::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep); }
.cell.link { color: var(--label); }
.cell.link:active, .row-main:active { background: var(--fill); }
.cell .ico { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; }
.cell .ico svg { width: 17px; height: 17px; }
.cell .chev { margin-left: auto; color: var(--label3); width: 14px; height: 14px; }

/* note rows with swipe to delete */
.row { position: relative; overflow: hidden; background: var(--card); }
.row-del { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; border: 0; background: var(--tint); color: #fff; font-size: 15px; font-weight: 600; display: grid; place-items: center; visibility: hidden; }
.row.swiping .row-del { visibility: visible; }
.row-main { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; width: 100%; padding: 12px 16px; border: 0; background: var(--card); text-align: left; touch-action: pan-y; transition: transform .28s cubic-bezier(.2, .9, .3, 1); will-change: transform; }
.row-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-dur { font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; }
.row-sub { grid-column: 1 / -1; font-size: 15px; color: var(--label2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub b { font-weight: 400; color: var(--label); margin-right: 6px; }
.row-wave { grid-column: 1 / -1; margin-top: 6px; }
.bars { display: flex; align-items: center; gap: 2px; height: 18px; }
.bars i { flex: 1; min-width: 1px; border-radius: 1px; background: var(--label3); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; color: var(--orange); background: color-mix(in srgb, var(--orange) 15%, transparent); padding: 1px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 56px 24px; color: var(--label2); }
.empty .big { width: 72px; height: 72px; border-radius: 50%; background: var(--tint-soft); color: var(--tint); display: grid; place-items: center; }
.empty .big svg { width: 32px; height: 32px; }
.empty strong { color: var(--label); font-size: 20px; }

/* bottom toolbar */
.toolbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bar); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border-top: 0.5px solid var(--sep); }
.tool-btn { justify-self: start; border: 0; background: none; color: var(--tint); padding: 8px; margin-left: -8px; }
.tool-btn svg { width: 25px; height: 25px; }
.tool-count { justify-self: end; font-size: 13px; color: var(--label2); }
.recbtn { width: 66px; height: 66px; border-radius: 50%; border: 3.5px solid var(--label3); background: none; padding: 0; display: grid; place-items: center; }
.recbtn span { width: 52px; height: 52px; border-radius: 50%; background: var(--tint); transition: width .3s cubic-bezier(.2, .9, .3, 1), height .3s cubic-bezier(.2, .9, .3, 1), border-radius .3s; }
.recbtn.live span { width: 26px; height: 26px; border-radius: 6px; }
.recbtn:active span { transform: scale(.94); }
.toolbar.rec-mode .tool-btn, .toolbar.rec-mode .tool-count { visibility: hidden; }

/* recorder */
.rec-status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--label2); padding: 4px 10px; border-radius: 999px; background: var(--fill); }
.rec-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); }
.rec-status.on { color: var(--tint); background: var(--tint-soft); }
.rec-status.on .dot { background: var(--tint); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.clock { text-align: center; font-family: var(--display); font-weight: 200; font-size: 76px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; padding-top: 18px; }
.clock-sub { text-align: center; font-size: 15px; color: var(--label2); margin-top: -12px; }
canvas.wave { width: 100%; height: 96px; display: block; }
.seg-ctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg-ctl button { border: 0; background: none; padding: 6px; border-radius: 7px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 5px; }
.seg-ctl button svg { width: 15px; height: 15px; }
.seg-ctl button[aria-pressed="true"] { background: var(--seg); box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); }
.mic-body { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 14px; }
.mic-hint { margin: 0; font-size: 13px; color: var(--label2); line-height: 1.4; }
.boost { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-size: 15px; }
.boost input { width: 100%; accent-color: var(--tint); }
.boost output { color: var(--label2); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.live-tx { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px 14px; max-height: 34vh; overflow-y: auto; font-size: 17px; line-height: 1.45; }
.live-tx .ln { color: var(--label2); }
.live-tx .ln:last-child { color: var(--label); }
.live-tx .interim { color: var(--label3); }
.notice { background: color-mix(in srgb, var(--orange) 14%, var(--card)); border-radius: 12px; padding: 12px 16px; font-size: 15px; line-height: 1.4; }

/* note */
.n-title { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: 0.005em; line-height: 1.18; margin: 4px 0 0; outline: none; border-radius: 8px; padding: 2px 4px; margin-inline: -4px; overflow-wrap: anywhere; }
.n-title:focus { background: var(--fill); }
.n-meta { font-size: 15px; color: var(--label2); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 0 6px; font-variant-numeric: tabular-nums; }
.n-hint { font-size: 13px; color: var(--label3); margin-top: 2px; }
.player { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; }
.play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--tint); color: #fff; display: grid; place-items: center; }
.play svg { width: 17px; height: 17px; }
.pwave { display: flex; align-items: center; gap: 2px; height: 40px; cursor: pointer; touch-action: none; }
.pwave i { flex: 1; min-width: 1px; border-radius: 1px; background: var(--label3); }
.pwave i.on { background: var(--tint); }
.ptime { font-size: 15px; color: var(--label2); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.tx { padding: 4px 0; }
.tx .seg { display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 8px 16px; transition: background .2s; line-height: 1.45; }
.tx .seg.active { background: var(--tint-soft); }
.tx .ts { font-size: 13px; color: var(--label2); background: none; border: 0; text-align: left; padding: 3px 0 0; font-variant-numeric: tabular-nums; }
.tx .seg.active .ts { color: var(--tint); }
.tx-empty { margin: 0; padding: 12px 16px; color: var(--label2); font-size: 15px; }
details.group summary { list-style: none; }
details.group summary::-webkit-details-marker { display: none; }
details.group[open] .chev { transform: rotate(90deg); }
.edit-body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
textarea { width: 100%; min-height: 180px; border: 0; background: var(--fill); color: var(--label); border-radius: 10px; padding: 10px 12px; font: 16px/1.45 var(--font); resize: vertical; }
.small-btn { align-self: flex-start; border: 0; background: var(--tint-soft); color: var(--tint); border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 600; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bar); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border-top: 0.5px solid var(--sep); }
.send { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 528px; margin: 0 auto; height: 50px; border: 0; border-radius: 14px; background: var(--tint); color: #fff; font-size: 17px; font-weight: 600; }
.send svg { width: 19px; height: 19px; }
.send:disabled { opacity: .4; cursor: default; }

/* action sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); animation: fade .2s ease both; }
.sheet { position: relative; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 560px; margin: 0 auto; padding: 0 max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); animation: up .3s cubic-bezier(.2, .9, .3, 1) both; }
.sheet-group { background: var(--bar); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px); border-radius: 14px; overflow: hidden; }
.sheet-msg { padding: 14px 16px; text-align: center; font-size: 13px; color: var(--label2); border-bottom: 0.5px solid var(--sep); }
.sheet-btn { display: block; width: 100%; height: 57px; border: 0; background: none; font-size: 20px; color: var(--tint); }
.sheet-btn.danger { color: var(--tint); }
.sheet-btn.cancel { background: var(--card); border-radius: 14px; font-weight: 600; color: var(--label); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(100%); } }

/* toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 14px; background: rgba(40, 40, 42, .94); color: #fff; font-size: 15px; box-shadow: 0 8px 30px rgba(0, 0, 0, .25); animation: fade .2s ease both; }
.toast a, .toast button { color: #FF6961; font-weight: 600; background: none; border: 0; padding: 0; text-decoration: none; }

/* screen transitions */
.anim-push { animation: push .38s cubic-bezier(.2, .9, .3, 1) both; }
.anim-pop { animation: pop .38s cubic-bezier(.2, .9, .3, 1) both; }
.anim-up { animation: up .42s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes push { from { transform: translateX(100%); } }
@keyframes pop { from { transform: translateX(-28%); opacity: .5; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<!-- LIST -->
<section id="view-list" class="view">
  <div class="nav"><span></span><span class="nav-title">Earmark</span><span></span></div>
  <div class="content">
    <div class="date-line" id="today"></div>
    <h1 class="large-title">Earmark</h1>
    <label class="searchfield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search" aria-label="Search notes">
    </label>
    <div id="notes" style="display:flex;flex-direction:column;gap:22px"></div>
    <div class="section">
      <div class="section-cap">Backup</div>
      <div class="group">
        <button class="cell link" id="btn-backup"><span class="ico" style="background:#007AFF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>Back Up Notes</button>
        <button class="cell link" id="btn-restore"><span class="ico" style="background:#34C759"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>Restore from Backup</button>
      </div>
      <div class="section-foot">Saves every note and recording into one file. Keep it in iCloud Drive so nothing is lost if this phone is.</div>
      <input type="file" id="restore-file" accept="application/json,.json" hidden>
    </div>
  </div>
</section>

<!-- RECORDER -->
<section id="view-rec" class="view" hidden>
  <div class="nav">
    <button class="nav-btn" id="rec-cancel">Cancel</button>
    <span class="nav-title always"><span class="rec-status" id="recpill"><span class="dot"></span><span id="rec-status">Ready</span></span></span>
    <span></span>
  </div>
  <div class="content">
    <div class="clock" id="clock">00:00</div>
    <div class="clock-sub" id="clock-sub">Tap the button to stop and save</div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div id="rec-notice" class="notice" hidden></div>
    <div class="section">
      <div class="section-cap">Microphone</div>
      <div class="group">
        <div class="mic-body">
          <div class="seg-ctl" role="group" aria-label="Microphone mode">
            <button id="mode-voice" data-mode="voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</button>
            <button id="mode-room" data-mode="room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>Room</button>
          </div>
          <p class="mic-hint" id="mode-hint"></p>
          <label class="boost" for="boost">Boost <input type="range" id="boost" min="1" max="4" step="0.25"> <output id="boost-val"></output></label>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-cap">Live transcript</div>
      <div class="group"><div class="live-tx" id="live-tx"><span class="ln">Words appear here as you talk.</span></div></div>
    </div>
  </div>
</section>

<!-- NOTE -->
<section id="view-note" class="view" hidden>
  <div class="nav">
    <button class="nav-btn" id="n-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>Notes</button>
    <span class="nav-title" id="n-navtitle"></span>
    <button class="nav-btn end" id="n-del" aria-label="Delete note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
  </div>
  <div class="content">
    <div>
      <h1 class="n-title" id="n-title" contenteditable="plaintext-only" spellcheck="false" role="textbox" aria-label="Note title"></h1>
      <div class="n-meta" id="n-meta"></div>
      <div class="n-hint">Tap the title to rename</div>
    </div>
    <div class="group">
      <div class="player">
        <button class="play" id="play" aria-label="Play recording"></button>
        <div class="pwave" id="pwave" aria-label="Recording progress"></div>
        <span class="ptime" id="ptime">00:00</span>
      </div>
      <audio id="n-audio" preload="metadata"></audio>
      <button class="cell link" id="n-share-audio" hidden><span class="ico" style="background:#007AFF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>Share Audio</button>
    </div>
    <div class="section">
      <div class="section-cap">Transcript</div>
      <div class="group"><div class="tx" id="n-tx"></div></div>
    </div>
    <details class="group">
      <summary class="cell link"><span class="ico" style="background:#8E8E93"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></span>Edit Transcript<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></summary>
      <div class="edit-body">

<script>
(() => {
"use strict";

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';

let toastT;

/* ---------- storage ---------- */
const KEY = "earmark.notes.v1", SEEDED = "earmark.seeded.v1";

const EXAMPLE = { id: "ex1", example: true, title: "Spring catalog launch sync", created: Date.now() - 3600e3 * 26, duration: 146,
  transcript: [
    { t: 0, text: "Okay, let's get started. This is the Thursday sync for the spring catalog launch." },
    { t: 9, text: "Priya, where are we on product photography?" },
    { t: 14, text: "We shot forty of the sixty items. The remaining twenty need the studio again, and the earliest slot is March 11th." },
    { t: 31, text: "That's tight. The site freeze is March 18th, so retouching has a week." },
    { t: 44, text: "Marco can take retouching if we send files the same day. I'll book the studio today." },
    { t: 62, text: "Next, pricing. Finance wants the new ceramics line at 10 percent above last year, but we should hold the large planters flat." },
    { t: 101, text: "Dana, can you draft that note to finance by Monday? Yes, I'll send it Monday morning." },

}
function titleOf(n) { return n.title || n.ai?.title || autoTitle(n); }

/* ---------- waveforms ---------- */
const BARS = 64;

  if (!levels.length) return [];

}

const barsHTML = (w) => w.map((v) => '<i style="height:' + Math.round(v * 100) + '%"></i>').join("");

/* ---------- routing, nav bar, transitions ---------- */
let current = null;
function show(view, anim) {

/* ---------- action sheet ---------- */
function confirmSheet(msg, okLabel) {

/* ---------- list ---------- */
const plain = (n) => n.transcript.map((s) => s.text).join(" ");

  const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return "Today";
  if (d.toDateString() === y.toDateString()) return "Yesterday";

}
function renderList() {
  $("#today").textContent = new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  const q = $("#q").value.trim().toLowerCase();

  $("#count").textContent = notes.length === 1 ? "1 Note" : notes.length + " Notes";

    box.innerHTML = q
      ? '<div class="empty">No results for “' + esc(q) + '”</div>'
      : '<div class="empty"><div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div><strong>No Notes Yet</strong><span>Tap the red button to record your first note.</span></div>';
    return;

    '<div class="row" data-id="' + esc(n.id) + '"><button class="row-del" tabindex="-1">Delete</button><button class="row-main">' +
      '<span class="row-title">' + esc(titleOf(n)) + (n.example ? '<span class="pill">Example</span>' : "") + '</span><span class="row-dur">' + fmt(n.duration) + "</span>" +

/* Swipe a row left to reveal Delete, like Mail. */
const OPEN_X = -88;

    openNote(row.dataset.id);

}

/* Delete with a few seconds to undo; the audio is only removed once the undo window closes. */
let undoT = null;
function deleteNote(id) {
  const i = notes.findIndex((x) => x.id === id); if (i < 0) return;

}

/* ---------- mic settings ---------- */
const MIC_KEY = "earmark.mic.v1";
const MODES = {
  voice: { hint: "Best for one person close to the phone. Filters out background noise and echo.", c: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } },
  room: { hint: "Picks up the whole room, including quieter voices farther away. Expect more background noise.", c: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }
};
let mic = { mode: "voice", boost: 1.5 };

if (!MODES[mic.mode]) mic.mode = "voice";
mic.boost = Math.min(4, Math.max(1, Number(mic.boost) || 1.5));
function saveMic() { try { localStorage.setItem(MIC_KEY, JSON.stringify(mic)); } catch {} }
function renderMic() {
  for (const m of ["voice", "room"]) $("#mode-" + m).setAttribute("aria-pressed", String(mic.mode === m));
  $("#mode-hint").textContent = MODES[mic.mode].hint;
  $("#boost").value = mic.boost;
  $("#boost-val").textContent = mic.boost.toFixed(2).replace(/0$/, "") + "×";
}
document.querySelectorAll(".seg-ctl button").forEach((b) => b.addEventListener("click", async () => {
  mic.mode = b.dataset.mode; saveMic(); renderMic();
  const track = R.stream?.getAudioTracks()[0];
  if (track) { try { await track.applyConstraints(MODES[mic.mode].c); } catch { toast("This mode starts with your next recording."); } }
}));
$("#boost").addEventListener("input", (e) => {
  mic.boost = Number(e.target.value); saveMic(); renderMic();
  if (R.gain && R.ctx) R.gain.gain.setTargetAtTime(mic.boost, R.ctx.currentTime, 0.05);
});
renderMic();

/* ---------- recorder ---------- */
const R = { stream: null, mr: null, chunks: [], ctx: null, an: null, gain: null, raf: 0, start: 0, elapsed: 0, timer: 0, sr: null, segs: [], interim: "", live: false, levels: [], all: [], lastSample: 0 };

$("#btn-rec").addEventListener("click", () => {
  if ($("#view-rec").hidden) startRecording();
  else if (R.live) stopRecording(true);
});
$("#rec-cancel").addEventListener("click", () => { stopRecording(false); $("#toolbar").hidden = false; renderList(); show("list", "pop"); });

function setStatus(txt, on) { $("#rec-status").textContent = txt; $("#recpill").classList.toggle("on", !!on); $("#btn-rec").classList.toggle("live", !!on); $("#btn-rec").setAttribute("aria-label", on ? "Stop and save" : "Start recording"); }

async function startRecording() {
  Object.assign(R, { chunks: [], segs: [], interim: "", elapsed: 0, levels: [], all: [], lastSample: 0 });

  $("#clock-sub").textContent = "Starting the microphone…";

    return;
  }

}
function curTime() { return R.elapsed + (R.live ? (performance.now() - R.start) / 1000 : 0); }

/* Keep the screen on while recording; iPhone drops the lock whenever the page is hidden. */

function releaseAwake() { try { R.lock && R.lock.release(); } catch {} R.lock = null; }

  keepAwake();
  if (R.hiddenAt != null) {
    const n = $("#rec-notice"); n.hidden = false;
    n.textContent = "Earmark was in the background at " + fmt(R.hiddenAt) + ". The recording may have a gap or stop there.";
    R.hiddenAt = null;
  }
});

function startSpeech() {
  if (!SR) { const n = $("#rec-notice"); n.hidden = false; n.textContent = "This browser records audio but can’t transcribe live. The audio is still saved, and you can type the transcript in the note."; return; }

  };

  try { sr.start(); } catch {}
}
function renderLive() {
  const box = $("#live-tx");
  const lines = R.segs.slice(-12).map((s) => '<span class="ln">' + esc(s.text) + "</span>").join("");
  const interim = R.interim ? '<span class="ln interim">' + esc(R.interim) + "</span>" : "";
  box.innerHTML = (lines + interim) || '<span class="ln">Listening…</span>';

function drawWave() {

      g.globalAlpha = 0.3 + 0.7 * (i / n);
      g.fillStyle = i > n - 6 ? tint : ink;
      if (g.roundRect) { g.beginPath(); g.roundRect(x, (h - bh) / 2, 2.5, bh, 1.25); g.fill(); } else g.fillRect(x, (h - bh) / 2, 2.5, bh);
    });
    g.globalAlpha = 1;
    R.raf = requestAnimationFrame(step);
  };
  step();
}
function stopRecording(keep) {
  const duration = curTime();
  R.live = false; R.hiddenAt = null; releaseAwake(); clearInterval(R.timer); cancelAnimationFrame(R.raf);
  const sr = R.sr; R.sr = null; try { sr && sr.stop(); } catch {}
  if (R.interim.trim()) { R.segs.push({ t: Math.max(0, Math.floor(duration - 3)), text: R.interim.trim() }); R.interim = ""; }
  const finish = () => {
    R.stream?.getTracks().forEach((t) => t.stop()); R.stream = null;
    try { R.ctx && R.ctx.close(); } catch {}
    R.ctx = null; R.gain = null; R.an = null;
    setStatus("Ready", false);
    if (!keep) return;
    const n = { id: uid(), created: Date.now(), duration, transcript: R.segs.slice(), hasAudio: false, wave: downsample(R.all, BARS) };
    if (R.chunks.length) { n.hasAudio = true; putAudio(n.id, new Blob(R.chunks, { type: R.mr?.mimeType || "audio/mp4" })); }
    notes.push(n); save(); openNote(n.id);
  };
  if (R.mr && R.mr.state !== "inactive") { R.mr.onstop = finish; try { R.mr.stop(); } catch { finish(); } }
  else finish();
}

/* ---------- import ---------- */
$("#btn-upload").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const dur = await new Promise((res) => { const a = new Audio(); a.preload = "metadata"; a.onloadedmetadata = () => res(isFinite(a.duration) ? a.duration : 0); a.onerror = () => res(0); a.src = URL.createObjectURL(f); });
  let wave = [];
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await ctx.decodeAudioData(await f.arrayBuffer());
    const d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / 2000)), lv = [];
    for (let i = 0; i < d.length; i += step) { let s = 0; for (let j = i; j < Math.min(d.length, i + step); j += 16) s = Math.max(s, Math.abs(d[j])); lv.push(s); }
    wave = downsample(lv, BARS); ctx.close();
  } catch {}
  const n = { id: uid(), created: Date.now(), duration: dur, title: f.name.replace(/\.[^.]+$/, "").slice(0, 60), transcript: [], hasAudio: true, wave };
  await putAudio(n.id, f);
  notes.push(n); save(); openNote(n.id);
});

/* ---------- note + player ---------- */
let audioUrl = null;
const audio = $("#n-audio");
function stopPlayback() { try { audio.pause(); } catch {} }
async function openNote(id) {
  current = id; stopPlayback();
  renderNote(); show("note", "push");
  const n = notes.find((x) => x.id === id);
  if (audioUrl) { URL.revokeObjectURL(audioUrl); audioUrl = null; }
  audio.removeAttribute("src"); setPlayable(false);
  if (n?.hasAudio) { const blob = await getAudio(id); if (blob && current === id) { audioUrl = URL.createObjectURL(blob); audio.src = audioUrl; setPlayable(true); } }
}
function setPlayable(ok) {
  $("#play").hidden = !ok;
  $("#n-share-audio").hidden = !ok;
  $("#play").innerHTML = ICON_PLAY;
  const n = notes.find((x) => x.id === current);
  $("#ptime").textContent = fmt(n?.duration);
  paintProgress(0);
}
function noteDuration() { const n = notes.find((x) => x.id === current); return isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (n?.duration || 0); }
function paintProgress(t) {
  const d = noteDuration(), frac = d ? t / d : 0;
  const bars = $("#pwave").children, lit = Math.round(frac * bars.length);
  for (let i = 0; i < bars.length; i++) bars[i].classList.toggle("on", i < lit);
  const n = notes.find((x) => x.id === current); if (!n) return;
  let active = -1; if (t > 0 || !audio.paused) n.transcript.forEach((s, i) => { if (s.t <= t + 0.2) active = i; });
  document.querySelectorAll("#n-tx .seg").forEach((el, i) => el.classList.toggle("active", i === active));
}
$("#play").addEventListener("click", () => { if (audio.paused) audio.play().catch(() => toast("This recording can’t play here.")); else audio.pause(); });
audio.addEventListener("play", () => ($("#play").innerHTML = ICON_PAUSE));
audio.addEventListener("pause", () => ($("#play").innerHTML = ICON_PLAY));
audio.addEventListener("ended", () => { $("#play").innerHTML = ICON_PLAY; paintProgress(0); $("#ptime").textContent = fmt(noteDuration()); });
audio.addEventListener("timeupdate", () => { paintProgress(audio.currentTime); $("#ptime").textContent = fmt(audio.currentTime); });
function seekFromEvent(e) {
  if (!audio.src) return;
  const r = $("#pwave").getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  audio.currentTime = Math.max(0, Math.min(1, x / r.width)) * noteDuration(); paintProgress(audio.currentTime); $("#ptime").textContent = fmt(audio.currentTime);
}
$("#pwave").addEventListener("pointerdown", seekFromEvent);

function renderNote() {
  const n = notes.find((x) => x.id === current); if (!n) return;
  $("#n-title").textContent = titleOf(n);
  $("#n-navtitle").textContent = titleOf(n);
  const words = n.transcript.reduce((a, s) => a + s.text.split(/\s+/).length, 0);
  $("#n-meta").innerHTML =
    "<span>" + esc(new Date(n.created).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })) + "</span><span>·</span>" +
    "<span>" + fmt(n.duration) + "</span><span>·</span><span>" + words.toLocaleString() + (words === 1 ? " word" : " words") + "</span>" +
    (n.example ? '<span class="pill" style="margin-left:2px">Example</span>' : "");
  $("#pwave").innerHTML = barsHTML(waveOf(n));
  $("#n-send").disabled = !n.transcript.length;
  const T = $("#n-tx");
  T.innerHTML = n.transcript.length
    ? n.transcript.map((s) => '<div class="seg"><button class="ts" data-t="' + s.t + '" aria-label="Play from ' + fmt(s.t) + '">' + fmt(s.t) + "</button><span>" + esc(s.text) + "</span></div>").join("")
    : '<p class="tx-empty">No words were captured. Open Edit Transcript below to type what was said.</p>';
  T.querySelectorAll(".ts").forEach((b) => b.addEventListener("click", () => {
    if (!audio.src) { toast("No audio saved for this note."); return; }
    audio.currentTime = Number(b.dataset.t); audio.play().catch(() => {});
  }));
  $("#tx-edit").value = n.transcript.map((s) => s.text).join("\n");
}

/* Tap the title to rename; Return or tapping away saves. An empty title goes back to the automatic one. */
function commitTitle() {
  const n = notes.find((x) => x.id === current); if (!n) return;
  const t = $("#n-title").textContent.replace(/\s+/g, " ").trim().slice(0, 80);
  if (t && t !== titleOf(n)) n.title = t;
  else if (!t) delete n.title;
  save();
  $("#n-title").textContent = titleOf(n); $("#n-navtitle").textContent = titleOf(n);
}
$("#n-title").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("#n-title").blur(); } });
$("#n-title").addEventListener("blur", commitTitle);

$("#tx-save").addEventListener("click", () => {
  const n = notes.find((x) => x.id === current); if (!n) return;
  const lines = $("#tx-edit").value.split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const old = n.transcript; const span = n.duration || lines.length * 8;
  n.transcript = lines.map((text, i) => ({ t: old[i]?.t ?? Math.round((i / Math.max(1, lines.length)) * span), text }));
  delete n.example; save(); renderNote(); toast("Transcript saved");
});

$("#n-del").addEventListener("click", async () => {
  if (!(await confirmSheet("This recording and its transcript will be deleted.", "Delete Recording"))) return;
  const id = current; stopPlayback(); current = null;
  show("list", "pop"); deleteNote(id);
});

/* ---------- files: backup, restore, share audio ---------- */
async function shareFile(file) {
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}
const toDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function buildBackup() {
  const audio = {};
  for (const n of notes) if (n.hasAudio) { const b = await getAudio(n.id); if (b) audio[n.id] = await toDataURL(b); }
  return { app: "earmark", version: 1, exported: new Date().toISOString(), notes, audio };
}
$("#btn-backup").addEventListener("click", async () => {
  if (!notes.length) { toast("There are no notes to back up yet."); return; }
  toast("Preparing backup…", 8000);
  const data = await buildBackup();
  const file = new File([JSON.stringify(data)], "earmark-backup-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
  if (await shareFile(file)) toast("Backed up " + notes.length + (notes.length === 1 ? " note" : " notes") + ". Keep the file somewhere safe, like iCloud Drive.", 4000);
  else $("#toast").hidden = true;
});
$("#btn-restore").addEventListener("click", () => $("#restore-file").click());
$("#restore-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { data = null; }
  if (!data || data.app !== "earmark" || !Array.isArray(data.notes)) { toast("That file isn’t an Earmark backup."); return; }
  const have = new Set(notes.map((n) => n.id));
  let added = 0, skipped = 0;
  for (const n of data.notes) {
    if (!n || !n.id || !Array.isArray(n.transcript)) continue;
    if (have.has(n.id)) { skipped++; continue; }
    const src = data.audio?.[n.id];
    if (n.hasAudio && typeof src === "string" && src.startsWith("data:")) {
      try { await putAudio(n.id, await (await fetch(src)).blob()); } catch { n.hasAudio = false; }
    } else n.hasAudio = false;
    notes.push(n); have.add(n.id); added++;
  }
  save(); renderList();
  toast("Restored " + added + (added === 1 ? " note" : " notes") + (skipped ? " (" + skipped + " already here)" : "") + ".", 3500);
});
$("#n-share-audio").addEventListener("click", async () => {
  const n = notes.find((x) => x.id === current); if (!n) return;
  const blob = await getAudio(n.id); if (!blob) { toast("No audio saved for this note."); return; }
  const t = blob.type || "";
  const ext = /mp4|aac|m4a/.test(t) ? ".m4a" : /webm/.test(t) ? ".webm" : /mpeg|mp3/.test(t) ? ".mp3" : /wav/.test(t) ? ".wav" : ".audio";
  const name = (titleOf(n).replace(/[\\/:*?"<>|]+/g, "").trim().slice(0, 60) || "Earmark recording") + ext;
  await shareFile(new File([blob], name, { type: t || "application/octet-stream" }));
});

/* ---------- send to Claude ---------- */
function transcriptText(n) {
  const head = "Transcript of my voice note “" + titleOf(n) + "” (" + new Date(n.created).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + ", " + fmt(n.duration) + "):";
  return head + "\n\n" + n.transcript.map((s) => "[" + fmt(s.t) + "] " + s.text).join("\n");
}
$("#n-send").addEventListener("click", async () => {
  const n = notes.find((x) => x.id === current); if (!n || !n.transcript.length) return;
  const text = transcriptText(n);
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('<span>Transcript copied.</span><a href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a>', 6000);
  } catch {
    $("#tx-edit").closest("details").open = true; $("#tx-edit").select();
    toast("Couldn’t copy automatically. The transcript is selected below; copy it and paste it into Claude.", 6000);
  }
});

/* ---------- boot ---------- */
load(); seed(); renderList(); show("list");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
