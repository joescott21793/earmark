<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Earmark</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Earmark">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F1F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D11" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: a pocket recorder. One phone-width column; notes as folded index cards with their own waveform; a frosted floating dock */
:root {
  --bg: #F1F2F5;
  --glow: rgba(229, 55, 42, 0.07);
  --surface: #FFFFFF;
  --surface-2: #F6F7F9;
  --ink: #14151A;
  --muted: #6B6E78;
  --faint: #A9ACB4;
  --line: rgba(20, 21, 26, 0.08);
  --rec: #E5372A;
  --rec-soft: rgba(229, 55, 42, 0.11);
  --amber: #B7791F;
  --amber-soft: #FBEFD3;
  --glass: rgba(255, 255, 255, 0.74);
  --shadow: 0 1px 2px rgba(20, 21, 26, 0.04), 0 10px 28px rgba(20, 21, 26, 0.07);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0C0D11; --glow: rgba(255, 77, 61, 0.11); --surface: #15171D; --surface-2: #1C1F26;
  --ink: #F3F2EF; --muted: #9497A1; --faint: #5E626D; --line: rgba(255, 255, 255, 0.07);
  --rec: #FF4D3D; --rec-soft: rgba(255, 77, 61, 0.15); --amber: #F2C46D; --amber-soft: rgba(242, 196, 109, 0.14);
  --glass: rgba(24, 26, 32, 0.72); --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 12px 32px rgba(0, 0, 0, 0.38);
  color-scheme: dark } }

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body { margin: 0; color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(130% 55% at 50% -12%, var(--glow), transparent 62%) no-repeat, var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--rec); outline-offset: 2px; }
svg { display: block; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 18px 150px; }
.view { display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 2.6rem; line-height: 1; font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: 1.75rem; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.icon { width: 22px; height: 22px; }

/* ---------- list ---------- */
.masthead { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.masthead .sub { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--muted); font-size: 0.9rem; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 12px 14px 12px 42px; font: inherit; box-shadow: var(--shadow); }
.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; align-items: center; gap: 10px; padding: 4px 2px 0; }
.group-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.note { position: relative; display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 16px 18px 15px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: left; transition: transform .15s ease; overflow: hidden; }
.note:active { transform: scale(0.985); }
.note::after { content: ""; position: absolute; top: 0; right: 0; width: 22px; height: 22px; background: linear-gradient(225deg, var(--bg) 50%, var(--surface-2) 50%); border-bottom-left-radius: 6px; box-shadow: -1px 1px 0 var(--line); }
.note.ex::after { background: linear-gradient(225deg, var(--bg) 50%, var(--amber-soft) 50%); }
.note-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-right: 18px; }
.note-title { font-weight: 700; font-size: 1.04rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.01em; }
.note-dur { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); flex: none; }
.note-prev { color: var(--muted); font-size: 0.9rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note-meta { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--faint); }
.tag-ex { color: var(--amber); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.68rem; }
.bars { display: flex; align-items: center; gap: 2px; height: 26px; }
.bars i { flex: 1; min-width: 1px; border-radius: 2px; background: var(--faint); opacity: .55; }
.note .bars i:nth-child(-n+64) { background: linear-gradient(var(--ink), var(--ink)); opacity: .22; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .ring { width: 64px; height: 64px; border-radius: 50%; border: 2px dashed var(--faint); display: grid; place-items: center; color: var(--rec); }

/* ---------- dock ---------- */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 22px; padding: 8px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(1.5); backdrop-filter: blur(22px) saturate(1.5); z-index: 10; }
.dockbtn { width: 48px; height: 48px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; color: var(--muted); }
.dockbtn:hover { color: var(--ink); background: var(--surface-2); }
.recbtn { position: relative; width: 70px; height: 70px; margin-block: -14px; border-radius: 50%; border: 0; background: var(--rec); display: grid; place-items: center; box-shadow: 0 0 0 5px var(--surface), 0 0 0 6px var(--line), 0 12px 28px var(--rec-soft); }
.recbtn span { width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: border-radius .25s ease, transform .25s ease; }
.recbtn.live span { border-radius: 6px; transform: scale(.92); }
.recbtn.live::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--rec); opacity: 0; animation: ping 1.6s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.35); opacity: 0; } }
.dock.solo .dockbtn { display: none; }

/* ---------- recorder ---------- */
.rec-top { display: flex; align-items: center; justify-content: space-between; }
.iconbtn { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.recpill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.recpill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.recpill.on { background: var(--rec-soft); border-color: transparent; color: var(--rec); }
.recpill.on .dot { background: var(--rec); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.clockwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 10px; }
.clock { font-family: var(--mono); font-weight: 300; font-size: 4.4rem; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.clock-sub { font-size: 0.85rem; color: var(--muted); }
canvas.wave { width: 100%; height: 110px; display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.seg-ctl { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; border: 1px solid var(--line); }
.seg-ctl button { border: 0; background: none; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 0.9rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg-ctl button svg { width: 16px; height: 16px; }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.mic-hint { font-size: 0.85rem; color: var(--muted); margin: 0; line-height: 1.45; }
.boost { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; font-size: 0.88rem; font-weight: 600; }
.boost input { width: 100%; accent-color: var(--rec); }
.boost output { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); min-width: 3.2em; text-align: right; }
.live-tx { display: flex; flex-direction: column; gap: 8px; max-height: 38vh; overflow-y: auto; font-size: 1.08rem; line-height: 1.5; }
.live-tx .ln { color: var(--muted); }
.live-tx .ln:last-child { color: var(--ink); }
.live-tx .interim { color: var(--faint); }
.notice { background: var(--amber-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 0.9rem; border: 1px solid var(--line); }

/* ---------- note ---------- */
.note-nav { display: flex; justify-content: space-between; align-items: center; }
.backbtn { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: 6px 8px 6px 0; font-weight: 600; color: var(--muted); }
.backbtn svg { width: 20px; height: 20px; }
.delbtn { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; }
.delbtn svg { width: 18px; height: 18px; }
.delbtn.armed { color: #fff; background: var(--rec); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.chip.ex { background: var(--amber-soft); color: var(--amber); font-weight: 700; }
.player { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.play { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.play svg { width: 18px; height: 18px; }
.pwave { display: flex; align-items: center; gap: 2px; height: 44px; cursor: pointer; touch-action: none; }
.pwave i { flex: 1; min-width: 1px; border-radius: 2px; background: var(--faint); opacity: .5; transition: background .1s, opacity .1s; }
.pwave i.on { background: var(--rec); opacity: 1; }
.ptime { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); min-width: 3.4em; text-align: right; }
.tx { display: flex; flex-direction: column; }
.tx .seg { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 9px 10px; margin-inline: -10px; border-radius: 12px; transition: background .2s; }
.tx .seg.active { background: var(--rec-soft); }
.tx .ts { font-family: var(--mono); font-size: 0.78rem; color: var(--faint); background: none; border: 0; text-align: left; padding: 3px 0 0; }
.tx .seg.active .ts, .tx .ts:hover { color: var(--rec); }
.tx-empty { color: var(--muted); margin: 0; }
details.panel summary { list-style: none; cursor: pointer; font-weight: 600; font-size: 0.92rem; display: flex; justify-content: space-between; align-items: center; }
details.panel summary::-webkit-details-marker { display: none; }
details.panel summary::after { content: "+"; font-size: 1.2rem; color: var(--muted); }
details.panel[open] summary::after { content: "–"; }
textarea { width: 100%; min-height: 180px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; line-height: 1.5; resize: vertical; }
.btn { align-self: flex-start; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 0.88rem; }
.backup-row { display: flex; justify-content: center; gap: 8px; padding-top: 6px; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px max(18px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 55%, transparent); z-index: 10; }
.send { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 444px; margin: 0 auto; border: 0; border-radius: 16px; padding: 16px 18px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 1.02rem; box-shadow: var(--shadow); }
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .4; cursor: default; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-size: 0.88rem; font-weight: 500; z-index: 30; width: max-content; max-width: calc(100% - 36px); text-align: center; box-shadow: var(--shadow); }
.toast a { color: inherit; font-weight: 700; }
.fade-in { animation: fadein .25s ease both; }
@keyframes fadein { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">

  <!-- LIST -->
  <section id="view-list" class="view">
    <header class="masthead">
      <div class="eyebrow" id="today"></div>
      <h1>Earmark</h1>
      <div class="sub"><span id="count"></span><span id="total" class="mono"></span></div>
    </header>
    <div class="search" id="search-wrap" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search transcripts" aria-label="Search transcripts">
    </div>
    <div id="notes" class="view" style="gap:22px"></div>
    <div class="backup-row">
      <button class="btn" id="btn-backup">Back up</button>
      <button class="btn" id="btn-restore">Restore</button>
      <input type="file" id="restore-file" accept="application/json,.json" hidden>
    </div>
  </section>

  <!-- RECORDER -->
  <section id="view-rec" class="view" hidden>
    <div class="rec-top">
      <button class="iconbtn" id="rec-cancel" aria-label="Discard recording"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="recpill" id="recpill"><span class="dot"></span><span id="rec-status">Ready</span></span>
      <span style="width:40px"></span>
    </div>
    <div class="clockwrap">
      <div class="clock" id="clock">00:00</div>
      <div class="clock-sub" id="clock-sub">Tap the button to stop and save</div>
    </div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <div class="panel">
      <div class="seg-ctl" role="group" aria-label="Microphone mode">
        <button id="mode-voice" data-mode="voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</button>
        <button id="mode-room" data-mode="room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>Room</button>
      </div>
      <p class="mic-hint" id="mode-hint"></p>
      <label class="boost" for="boost">Boost <input type="range" id="boost" min="1" max="4" step="0.25"> <output id="boost-val"></output></label>
    </div>
    <div id="rec-notice" class="notice" hidden></div>
    <div class="panel">
      <div class="eyebrow">Live transcript</div>
      <div class="live-tx" id="live-tx"><span class="ln">Words appear here as you talk.</span></div>
    </div>
  </section>

  <!-- NOTE -->
  <section id="view-note" class="view" hidden>
    <div class="note-nav">
      <button class="backbtn" id="n-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Notes</button>
      <button class="delbtn" id="n-del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span>Delete</span></button>
    </div>
    <div>
      <h2 id="n-title"></h2>
      <div class="chips" id="n-meta"></div>
    </div>
    <div class="panel">
      <div class="player">
        <button class="play" id="play" aria-label="Play recording"></button>
        <div class="pwave" id="pwave" aria-label="Recording progress"></div>
        <span class="ptime" id="ptime">00:00</span>
      </div>
      <audio id="n-audio" preload="metadata"></audio>
      <button class="btn" id="n-share-audio" hidden>Share audio</button>
    </div>
    <div class="panel">
      <div class="eyebrow">Transcript</div>
      <div class="tx" id="n-tx"></div>
    </div>
    <details class="panel">
      <summary>Edit transcript</summary>
      <textarea id="tx-edit" placeholder="Type or paste what was said, one line per sentence…"></textarea>
      <button class="btn" id="tx-save">Save transcript</button>
    </details>
  </section>
</div>

<div class="dock" id="dock">
  <button class="dockbtn" id="btn-upload" aria-label="Import audio"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
  <button class="recbtn" id="btn-rec" aria-label="Start recording"><span></span></button>
  <button class="dockbtn" id="btn-search" aria-label="Search notes"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  <input type="file" id="file" accept="audio/*" hidden>
</div>
<div class="actionbar" id="actionbar" hidden>
  <button class="send" id="n-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Send transcript to Claude</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0"); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';
let toastT;
function toast(html, ms) { const t = $("#toast"); t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms || 2400); }

/* ---------- storage ---------- */
const KEY = "earmark.notes.v1", SEEDED = "earmark.seeded.v1";
let notes = [];
function load() { try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { notes = []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch {} }
let idb = null;
function openIdb() {

  }));
  $("#tx-edit").value = n.transcript.map((s) => s.text).join("\n");
  const del = $("#n-del"); del.classList.remove("armed"); del.querySelector("span").textContent = "Delete"; delArmed = 0;
}
$("#tx-save").addEventListener("click", () => {
  const n = notes.find((x) => x.id === current); if (!n) return;
  const lines = $("#tx-edit").value.split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const old = n.transcript; const span = n.duration || lines.length * 8;
  n.transcript = lines.map((text, i) => ({ t: old[i]?.t ?? Math.round((i / Math.max(1, lines.length)) * span), text }));
  delete n.example; save(); renderNote(); toast("Transcript saved");
});

/* ---------- files: backup, restore, share audio ---------- */
async function shareFile(file) {
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(file), a = document.createElement("a");
  a.href = url; a.download = file.name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}
const toDataURL = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function buildBackup() {
  const audio = {};
  for (const n of notes) if (n.hasAudio) { const b = await getAudio(n.id); if (b) audio[n.id] = await toDataURL(b); }
  return { app: "earmark", version: 1, exported: new Date().toISOString(), notes, audio };
}
$("#btn-backup").addEventListener("click", async () => {
  if (!notes.length) { toast("There are no notes to back up yet."); return; }
  toast("Preparing backup…", 8000);
  const data = await buildBackup();
  const file = new File([JSON.stringify(data)], "earmark-backup-" + new Date().toISOString().slice(0, 10) + ".json", { type: "application/json" });
  if (await shareFile(file)) toast("Backed up " + notes.length + (notes.length === 1 ? " note" : " notes") + ". Keep the file somewhere safe, like iCloud Drive.", 4000);
  else $("#toast").hidden = true;
});
$("#btn-restore").addEventListener("click", () => $("#restore-file").click());
$("#restore-file").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { data = null; }
  if (!data || data.app !== "earmark" || !Array.isArray(data.notes)) { toast("That file isn’t an Earmark backup."); return; }
  const have = new Set(notes.map((n) => n.id));
  let added = 0, skipped = 0;
  for (const n of data.notes) {
    if (!n || !n.id || !Array.isArray(n.transcript)) continue;
    if (have.has(n.id)) { skipped++; continue; }
    const src = data.audio?.[n.id];
    if (n.hasAudio && typeof src === "string" && src.startsWith("data:")) {
      try { await putAudio(n.id, await (await fetch(src)).blob()); } catch { n.hasAudio = false; }
    } else n.hasAudio = false;
    notes.push(n); have.add(n.id); added++;
  }
  save(); renderList();
  toast("Restored " + added + (added === 1 ? " note" : " notes") + (skipped ? " (" + skipped + " already here)" : "") + ".", 3500);
});
$("#n-share-audio").addEventListener("click", async () => {
  const n = notes.find((x) => x.id === current); if (!n) return;
  const blob = await getAudio(n.id); if (!blob) { toast("No audio saved for this note."); return; }
  const t = blob.type || "";
  const ext = /mp4|aac|m4a/.test(t) ? ".m4a" : /webm/.test(t) ? ".webm" : /mpeg|mp3/.test(t) ? ".mp3" : /wav/.test(t) ? ".wav" : ".audio";
  const name = (titleOf(n).replace(/[\\/:*?"<>|]+/g, "").trim().slice(0, 60) || "Earmark recording") + ext;
  await shareFile(new File([blob], name, { type: t || "application/octet-stream" }));
});

/* ---------- send to Claude ---------- */
function transcriptText(n) {
  const head = "Transcript of my voice note “" + titleOf(n) + "” (" + new Date(n.created).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) + ", " + fmt(n.duration) + "):";
  return head + "\n\n" + n.transcript.map((s) => "[" + fmt(s.t) + "] " + s.text).join("\n");
}
$("#n-send").addEventListener("click", async () => {
  const n = notes.find((x) => x.id === current); if (!n || !n.transcript.length) return;
  const text = transcriptText(n);
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('Transcript copied. <a href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a> and paste it.', 6000);
  } catch {
    $("#tx-edit").closest("details").open = true; $("#tx-edit").select();
    toast("Couldn’t copy automatically. The transcript is selected below; copy it and paste it into Claude.", 6000);
  }
});

let delArmed = 0;
$("#n-del").addEventListener("click", () => {
  const b = $("#n-del");
  if (Date.now() - delArmed > 3000) {
    delArmed = Date.now(); b.classList.add("armed"); b.querySelector("span").textContent = "Tap again";
    setTimeout(() => { if (Date.now() - delArmed >= 2900) { b.classList.remove("armed"); b.querySelector("span").textContent = "Delete"; } }, 3000);
    return;
  }
  stopPlayback();
  notes = notes.filter((x) => x.id !== current); delAudio(current); save(); delArmed = 0;
  current = null; renderList(); show("list"); toast("Note deleted");
});

/* ---------- boot ---------- */
load(); seed(); renderList(); show("list");
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
